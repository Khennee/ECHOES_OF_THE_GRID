
name: Bug Report
description: Report a defect or unexpected behavior
title: "[BUG] "
labels:
  - BUG

body:
  - type: input
    id: linear_issue
    attributes:
      label: Linear Issue ID
      description: Provide the associated Linear issue identifier, if available.
      placeholder: SUP-123
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Briefly describe the issue.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open the game.
        2. Navigate to...
        3. Interact with...
        4. Observe the issue.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows x64
        - macOS Apple Silicon
        - macOS Intel
        - Multiple platforms
        - CI environment
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Game Version, Branch, or Commit
      placeholder: development

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, Recordings, or Logs
      description: Attach relevant evidence without sensitive information.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
