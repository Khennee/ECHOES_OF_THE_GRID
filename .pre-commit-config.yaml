minimum_pre_commit_version: "4.7.0"

default_install_hook_types:
  - pre-commit
  - commit-msg

exclude: '(^|/)(addons|\.godot|\.venv|builds|exports)/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

      - id: end-of-file-fixer

      - id: check-yaml
        exclude: ^gdlintrc$

      - id: check-json

      - id: check-merge-conflict

      - id: check-case-conflict

      - id: check-added-large-files
        args: [--maxkb=5120]

  - repo: local
    hooks:
      - id: gdformat
        name: GDScript Formatter
        entry: gdformat --line-length 100
        language: python
        additional_dependencies:
          - gdtoolkit==4.5.0
        files: ^game/.*\.gd$
        require_serial: true

      - id: gdlint
        name: GDScript Linter
        entry: gdlint
        language: python
        additional_dependencies:
          - gdtoolkit==4.5.0
        files: ^game/.*\.gd$

      - id: godot-import
        name: Godot Project Import
        entry: python tools/godot_checks.py import
        language: python
        pass_filenames: false
        always_run: true
        require_serial: true

      - id: godot-static-analysis
        name: Godot Static Analysis
        entry: python tools/godot_checks.py check
        language: python
        pass_filenames: false
        always_run: true
        require_serial: true

      - id: gut-tests
        name: GUT Automated Tests
        entry: python tools/godot_checks.py test
        language: python
        pass_filenames: false
        always_run: true
        require_serial: true

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
